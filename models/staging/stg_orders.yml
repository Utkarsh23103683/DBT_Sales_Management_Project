version: 2

models: 
    - name: stg_orders
      description: "This model is a staging model for the orders table."
      columns:
        - name: order_id
          description: "The unique identifier for each order."
          data_tests:
            - not_null
            - unique
        - name: customer_id
          description: "The unique identifier for the customer who placed the order."
          data_tests:
            - not_null
        - name: payment_method
          description: "The method of payment used for the order."
          data_tests:
            - not_null
            - accepted_values:
                values: ['Credit Card', 'Online', 'Debit Card', 'Cash' , 'Gift Card']
        - name: order_status
          description: "The current status of the order."
          data_tests:
            - not_null
            - accepted_values:
                values: ['Pending', 'Returned', 'Completed', 'Cancelled']
        - name: total_amount
          description: "The total amount for the order."
          data_tests:
            - not_null
            - relationships:
                to: ref('stg_customers')
                field: customer_id
        - name: active_status
          description: "Indicates whether the order is active or not."
          data_tests:
            - not_null
            - accepted_values:
                values: ['Active', 'Inactive']  